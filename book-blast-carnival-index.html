<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10284e">
<title>Gilbert Elementary | Book Blast Carnival</title>
<style>
:root{--night:#101d49;--blue:#1a63c0;--green:#0d804c;--gold:#ffce48;--pink:#ff6b9d;--cream:#fff9e7;--ink:#122b4a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Trebuchet MS,Arial,sans-serif}body{background:#0e1e48;color:var(--cream);overflow-x:hidden}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:4px solid #fff;outline-offset:4px}button:disabled{cursor:not-allowed;opacity:.42}
.app{min-height:100svh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 83%,#316ea1 0,#194875 33%,#121c48 79%)}
.stars,.stars:after{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,#fff 1px,transparent 1.8px);background-size:84px 69px;opacity:.34}.stars:after{content:'';background-size:123px 91px;background-position:42px 19px;opacity:.65;animation:twinkle 4s ease-in-out infinite alternate}
.moon{position:absolute;right:9%;top:10%;width:98px;aspect-ratio:1;border-radius:50%;background:#fff2a8;box-shadow:0 0 55px #ffdf8b88}.ground{position:absolute;bottom:-12vh;left:-10%;width:120%;height:36vh;background:radial-gradient(ellipse at 50% 0,#286d66,#14503e 80%);border-radius:50% 50% 0 0}
.bulbline{position:absolute;top:0;left:-3%;right:-3%;height:105px;border-bottom:4px solid #ffe39288;border-radius:0 0 50% 50%;pointer-events:none;display:flex;align-items:flex-end;justify-content:space-around;padding-bottom:6px}.bulbline span{width:15px;height:23px;border-radius:50%;background:#ffe15d;box-shadow:0 0 15px 5px #ffe15d88;animation:glow 1.8s infinite alternate}.bulbline span:nth-child(3n){background:#ff729e;box-shadow:0 0 14px #ff729e}.bulbline span:nth-child(3n+1){background:#8ee7fe;box-shadow:0 0 14px #8ee7fe}
.mast{position:relative;z-index:2;text-align:center;padding:26px 16px 8px}.school{font-weight:900;font-size:clamp(13px,1.7vw,24px);letter-spacing:.24em;color:#fff}.mast h1{font-size:clamp(41px,6.8vw,102px);line-height:.95;letter-spacing:-.055em;color:var(--gold);text-shadow:0 5px 0 #932b53,0 9px 18px #061b3b;margin:9px 0 12px}.mast p{font-size:clamp(16px,1.8vw,27px);font-weight:800;margin:0}.tag{display:inline-block;background:#fff1a4;color:#7d2946;border-radius:100px;padding:7px 19px;transform:rotate(-2deg);font-size:clamp(13px,1.5vw,21px)}
.midway{position:relative;z-index:3;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(9px,1.4vw,20px);max-width:1500px;margin:clamp(28px,5vh,70px) auto 100px;padding:0 clamp(12px,2vw,30px)}
.ride{color:var(--cream);background:linear-gradient(145deg,#0d416fdd,#112d62e8);border:3px solid #ffde88;border-radius:26px;min-height:clamp(200px,29vw,370px);padding:13px 9px 18px;position:relative;box-shadow:0 13px 0 #08152f,0 20px 28px #0006;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:10px;transition:transform .18s,box-shadow .18s}.ride:hover,.ride:focus-visible{transform:translateY(-9px);box-shadow:0 22px 0 #08152f,0 30px 30px #0007}.ride small{position:absolute;top:11px;left:12px;padding:4px 10px;background:var(--gold);color:#47284a;font-weight:900;border-radius:30px;font-size:clamp(10px,1vw,15px)}.ride .art{height:clamp(95px,15vw,205px);width:100%;display:grid;place-items:center;font-size:clamp(70px,10vw,150px);filter:drop-shadow(0 12px 6px #0005);transform-origin:50% 65%}.ride strong{font-size:clamp(17px,2.1vw,31px);line-height:1.08;text-shadow:0 2px 2px #000;text-align:center}.ride em{font-size:clamp(12px,1.1vw,17px);font-style:normal;opacity:.88;text-align:center}.ride:nth-child(2){background:linear-gradient(155deg,#a31a67,#531e68)}.ride:nth-child(3){background:linear-gradient(155deg,#116851,#154a75)}.ride:nth-child(4){background:linear-gradient(155deg,#7550a0,#244d86)}.ride:nth-child(5){background:linear-gradient(155deg,#b74939,#71264c)}
.wheel{animation:spin 23s linear infinite}.bounce{animation:bob 2.5s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite}.pulse{animation:bob 1.7s ease-in-out infinite alternate}
.intro{position:relative;z-index:3;text-align:center;margin:-53px 0 55px}.intro button{background:var(--gold);border:0;border-bottom:7px solid #cf662f;border-radius:30px;font-size:clamp(19px,2.3vw,31px);font-weight:1000;color:#522c49;padding:15px 28px;box-shadow:0 12px 23px #0006}
.toolbar{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#081833eb;border-top:2px solid #ffffff44}.toolbar button,.panelNav button{border:2px solid #ffffff55;border-radius:11px;background:#173e72;color:white;font-weight:900;padding:10px 15px}.toolbar button:hover,.panelNav button:hover{background:#2868a4}.toolbar .filled,.panelNav .filled{background:var(--gold);color:#44243e;border-color:var(--gold)}.toolbar .status{margin-left:auto;font-weight:900;font-size:14px;white-space:nowrap}
.overlay{position:fixed;z-index:10;inset:0;background:#07112dd6;display:grid;place-items:center;padding:20px;backdrop-filter:blur(8px)}.overlay[hidden]{display:none}.panel{width:min(1200px,100%);height:min(780px,88svh);min-height:420px;position:relative;overflow:hidden;border:7px solid #ffcf61;border-radius:32px;background:radial-gradient(circle at 60% 5%,#276a97 0,#164c75 43%,#11274f 100%);box-shadow:0 20px 90px #000c;display:flex;flex-direction:column;text-align:center}.panel:before{content:'✦ ★ ✦ ★ ✦';position:absolute;inset:35px auto auto 4%;font-size:90px;color:#fff1a219;pointer-events:none;letter-spacing:50px}.panelHead{position:relative;z-index:1;background:#b72e65;padding:10px 55px;font-size:clamp(15px,2vw,26px);font-weight:900;letter-spacing:.08em}.close{position:absolute;z-index:4;right:11px;top:6px;background:#fff;color:#692a53;border:0;border-radius:50%;width:42px;height:42px;font-size:28px;font-weight:900;line-height:1}.panelBody{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:16px 5% 8px;min-height:0}.panelIcon{font-size:clamp(70px,11svh,150px);line-height:1.05;filter:drop-shadow(0 8px 12px #0007)}.panel h2{font-size:clamp(36px,6.3vw,84px);letter-spacing:-.045em;line-height:1.02;margin:10px 0;color:#ffe16f;text-shadow:0 4px #692a59;text-wrap:balance}.panel p{font-size:clamp(19px,3vw,39px);line-height:1.17;font-weight:700;max-width:920px;margin:10px auto;text-wrap:balance}.panel .sub{font-size:clamp(15px,1.7vw,23px);color:#f8edc5}.panelNav{position:relative;z-index:2;display:flex;gap:10px;align-items:center;justify-content:space-between;background:#071c3bd9;padding:12px 18px}.panelNav span{font-weight:900;color:#ffe19b}.cta{display:inline-block;background:#ffdf59;color:#30244f;text-decoration:none;border-radius:50px;padding:15px 28px;font-size:clamp(18px,2.1vw,29px);font-weight:1000;box-shadow:0 7px 0 #bf6f27}.cta:hover{transform:translateY(-3px)}
.notes{position:absolute;z-index:5;left:3%;right:3%;bottom:80px;padding:17px 25px;border:4px solid var(--gold);border-radius:16px;background:#fffbed;color:#163b59;max-height:32%;overflow:auto;text-align:left;font-size:clamp(16px,1.6vw,24px);line-height:1.35;box-shadow:0 8px 20px #0006}.notes[hidden]{display:none}
.confetti{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-30px;width:12px;height:20px;background:hsl(var(--h) 90% 64%);animation:fall var(--d) linear forwards;left:var(--x);transform:rotate(var(--r))}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{50%{transform:translateY(-13px)}}@keyframes sway{50%{transform:rotate(8deg)}}@keyframes twinkle{to{opacity:.18}}@keyframes glow{to{filter:brightness(.6)}}@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(900deg);opacity:.8}}
@media(max-width:970px){.midway{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:85px}.ride{min-height:230px}.intro{margin:0 0 100px}.art{height:125px!important}.ride:last-child{grid-column:2}}
@media(max-width:580px){.moon{width:55px}.midway{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:28px}.ride{min-height:200px}.ride:last-child{grid-column:1/-1}.ride .art{height:100px!important}.panel{height:88svh;min-height:0}.panelHead{padding:10px 48px}.panelNav{padding:9px;gap:5px}.panelNav button{padding:9px;font-size:13px}.toolbar{padding:6px}.toolbar button{padding:8px;font-size:13px}.toolbar .status{font-size:11px}.panelIcon{font-size:65px}.notes{bottom:65px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="stars" aria-hidden="true"></div><div class="moon" aria-hidden="true"></div><div class="ground" aria-hidden="true"></div>
  <div class="bulbline" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <header class="mast"><div class="school">🐊 GILBERT ELEMENTARY SCHOOL 🐊</div><h1>BOOK BLAST CARNIVAL!</h1><p><span class="tag">STEP RIGHT UP, GATORS!</span></p></header>
  <main class="midway" aria-label="Interactive carnival attractions">
    <button class="ride" data-start="0"><small>STOP 1</small><span class="art wheel" aria-hidden="true">🎡</span><strong>Welcome Wheel</strong><em>Kick off the excitement!</em></button>
    <button class="ride" data-start="2"><small>STOP 2</small><span class="art sway" aria-hidden="true">🎪</span><strong>Treasure Map Tent</strong><em>Your mission starts here.</em></button>
    <button class="ride" data-start="4"><small>STOP 3</small><span class="art bounce" aria-hidden="true">🎁</span><strong>Prize Pavilion</strong><em>Discover the surprises.</em></button>
    <button class="ride" data-start="6"><small>STOP 4</small><span class="art pulse" aria-hidden="true">🎬</span><strong>Big Top Theater</strong><em>It's showtime!</em></button>
    <button class="ride" data-start="7"><small>STOP 5</small><span class="art bounce" aria-hidden="true">🐊</span><strong>Gator Finale</strong><em>End with a cheer!</em></button>
  </main>
  <div class="intro"><button id="start">🎟️ OPEN THE CARNIVAL!</button></div>
</div>
<div class="toolbar"><button id="home">🏠 Midway</button><button id="back">◀ Back</button><button id="forward" class="filled">Next ▶</button><button id="notesToggle">🎤 Notes</button><button id="fullscreen">⛶ Full screen</button><span class="status" id="status">Choose an attraction</span></div>
<section class="overlay" id="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="panelTitle">
  <div class="panel"><div class="panelHead" id="panelHead">BOOK BLAST CARNIVAL</div><button class="close" id="close" aria-label="Close attraction">×</button>
    <div class="panelBody" id="panelBody"></div>
    <div class="notes" id="speakerNotes" hidden></div>
    <div class="panelNav"><button id="modalBack">◀ Previous</button><span id="panelNumber">1 of 9</span><button id="modalNext" class="filled">Next Stop ▶</button></div>
  </div>
</section>
<div class="confetti" id="confetti" aria-hidden="true"></div>
<script>
// Change this only if your Book Blast contact gives you a different launch link.
const VIDEO_URL='https://app.booksarefun.us/kickoff-video/45257658948/';
// Add a publicly accessible video URL here ONLY if you host your uploaded carnival MP4.
// A local file or a GitHub repository URL will not play as a video on GitHub Pages.
const CARNIVAL_VIDEO_URL='';
const slides=[
 {zone:'🎡 THE WELCOME WHEEL',icon:'🎡',title:'Welcome, Gators!',body:'Today, our school becomes a BOOK BLAST CARNIVAL!',sub:'Are you ready to have some fun?',notes:'Welcome, Gators! I need your best carnival cheer! On three, yell BOOK BLAST. One, two, three!'},
 {zone:'🎡 THE WELCOME WHEEL',icon:'📚',title:'Who loves books?',body:'Raise your hand if you love funny stories, adventures, or learning something new!',sub:'Every reader belongs at this carnival.',notes:'Ask for hands. Pause for the audience. Tell them Book Blast is about celebrating books and reading.'},
 {zone:'🎪 TREASURE MAP TENT',icon:'🗺️',title:'A Treasure Map for YOU!',body:'Every student gets a Treasure Map to take home on November 2.',sub:'Your teacher will give you your map.',notes:'Hold up a real Treasure Map if available. Students will receive one to take home on launch day. Avoid announcing any prize rules before confirming them.'},
 {zone:'🎪 TREASURE MAP TENT',icon:'🏡',title:'Your 3-Step Mission',body:'1. Take your map home.<br>2. Show a grown-up.<br>3. Explore the directions together.',sub:'Families can decide how they want to participate.',notes:'Read each step and have students repeat the key words: HOME, GROWN-UP, TOGETHER. Participation is a family decision, and nobody should feel pressured.'},
 {zone:'🎁 PRIZE PAVILION',icon:'🎁',title:'Prizes Along the Way!',body:'Watch for Treasure Map prize opportunities during Book Blast!',sub:'Your teachers will share official details.',notes:'Prize distribution for Treasure Map achievers is scheduled to begin November 3. Do not promise that every student will earn every prize.'},
 {zone:'🎁 PRIZE PAVILION',icon:'🏆',title:'Listen for Winners!',body:'Treasure Chest winners will be announced at school!',sub:'Keep your ears open for morning announcements.',notes:'The schedule lists Treasure Chest winner announcements starting November 4. Winner names come in the daily event email.'},
 {zone:'🎬 BIG TOP THEATER',icon:'🎬',title:'It’s Showtime!',body:'Let’s watch the Book Blast kickoff video!',sub:'Open the video in a new tab, then come back to finish the carnival.',video:true,notes:'Click the video button. Make sure sound works before the assembly. The linked video is the official Book Blast kickoff link listed in the Gilbert schedule. The 134 MB uploaded carnival MP4 needs its own public host before it can be embedded here.'},
 {zone:'🐊 GATOR FINALE',icon:'🙌',title:'Ready, Gators?',body:'Take home your Treasure Map and share it with your family!',sub:'When I say BOOK, you say BLAST!',notes:'Lead two rounds: BOOK! (students: BLAST!) BOOK! (students: BLAST!). Remind teachers to distribute one Treasure Map to each student.'},
 {zone:'🐊 GATOR FINALE',icon:'🐊🎉',title:'GO GATORS!',body:'Let’s make this a wonderful reading celebration!',sub:'BOOK BLAST • NOVEMBER 2, 2026',finale:true,notes:'Thank everyone. Press CELEBRATE for falling confetti. Return students to teachers when ready.'}
];
let current=-1,notesVisible=false,previousFocus=null;
const $=id=>document.getElementById(id);
function openSlide(n){
 current=Math.min(slides.length-1,Math.max(0,n));const s=slides[current];
 if($('overlay').hidden)previousFocus=document.activeElement;
 $('overlay').hidden=false;$('panelHead').textContent=s.zone;
 $('panelBody').innerHTML='<div class="panelIcon" aria-hidden="true">'+s.icon+'</div><h2 id="panelTitle">'+s.title+'</h2><p>'+s.body+'</p><p class="sub">'+s.sub+'</p>'+(s.video?'<p><a class="cta" id="videoLink" target="_blank" rel="noopener noreferrer" href="'+VIDEO_URL+'">▶ PLAY BOOK BLAST VIDEO</a></p>':'')+(s.finale?'<p><button class="cta" id="celebrate" type="button">🎊 CELEBRATE! 🎊</button></p>':'');
 $('speakerNotes').textContent='🎤 WHAT TO SAY: '+s.notes;$('speakerNotes').hidden=!notesVisible;
 $('panelNumber').textContent=(current+1)+' of '+slides.length;
 $('modalBack').disabled=$('back').disabled=current===0;
 $('modalNext').disabled=$('forward').disabled=current===slides.length-1;
 $('status').textContent='Stop '+(current+1)+' of '+slides.length;
 if(s.finale)$('celebrate').addEventListener('click',celebrate);
 $('close').focus();
}
function closeSlide(){current=-1;$('overlay').hidden=true;$('status').textContent='Choose an attraction';$('back').disabled=true;$('forward').disabled=false;if(previousFocus?.focus)previousFocus.focus()}
function next(){if(current<0)openSlide(0);else if(current<slides.length-1)openSlide(current+1)}
function back(){if(current>0)openSlide(current-1)}
function toggleNotes(){notesVisible=!notesVisible;$('speakerNotes').hidden=!notesVisible||current<0;$('notesToggle').textContent=notesVisible?'🎤 Hide Notes':'🎤 Notes'}
function celebrate(){
 const container=$('confetti');container.innerHTML='';
 for(let i=0;i<160;i++){let piece=document.createElement('i');piece.style.setProperty('--x',Math.random()*100+'%');piece.style.setProperty('--h',Math.round(Math.random()*360));piece.style.setProperty('--d',(2.8+Math.random()*2.4)+'s');piece.style.setProperty('--dx',((Math.random()-.5)*180)+'px');piece.style.setProperty('--r',Math.floor(Math.random()*360)+'deg');piece.style.animationDelay=(Math.random()*.8)+'s';container.appendChild(piece)}
 setTimeout(()=>{container.innerHTML=''},6200);
}
function fullScreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.()}
document.querySelectorAll('[data-start]').forEach(b=>b.addEventListener('click',()=>openSlide(Number(b.dataset.start))));
$('start').addEventListener('click',()=>openSlide(0));$('home').addEventListener('click',closeSlide);$('close').addEventListener('click',closeSlide);
$('forward').addEventListener('click',next);$('modalNext').addEventListener('click',next);$('back').addEventListener('click',back);$('modalBack').addEventListener('click',back);
$('notesToggle').addEventListener('click',toggleNotes);$('fullscreen').addEventListener('click',fullScreen);
$('back').disabled=true;
document.addEventListener('keydown',e=>{
 if(e.target.closest('a'))return;
 if(e.key==='Escape'&&current>=0){closeSlide();return}
 if(['ArrowRight','PageDown'].includes(e.key)||(e.key===' '&&!e.target.closest('button'))){e.preventDefault();next()}
 if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();back()}
 if(e.key.toLowerCase()==='n'&&!e.repeat&&e.target.tagName!=='INPUT'){toggleNotes()}
});
// Prevent tabs from leaving the open presentation dialog.
document.addEventListener('keydown',e=>{if(e.key!=='Tab'||current<0)return;const focusable=[...$('overlay').querySelectorAll('button:not(:disabled),a[href]')];let i=focusable.indexOf(document.activeElement);if(e.shiftKey&&i===0){e.preventDefault();focusable.at(-1).focus()}else if(!e.shiftKey&&i===focusable.length-1){e.preventDefault();focusable[0].focus()}});
</script>
</body>
</html>
